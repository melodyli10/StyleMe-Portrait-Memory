<!doctype html><html lang="en"><meta charset="utf-8"><title>StyleMe face integration checks</title>
<style>body{font:14px system-ui;background:#fafaf7;padding:20px;color:#292c29}button,input{padding:8px;margin:5px}pre{white-space:pre-wrap}canvas{width:310px;max-width:100%;height:auto}figure{margin:16px 0}iframe{width:100%;height:850px;border:1px solid #ddd}#results{display:grid;grid-template-columns:repeat(2,320px);gap:10px}#results details{grid-column:1 / -1}@media(max-width:680px){#results{grid-template-columns:1fr}} </style>
<h1>Face slimming integration checks</h1><p>Runs the real root interface. Public examples are downloaded only when selected; your local file stays in the browser. Crops include hair/background to inspect side effects.</p>
<input id="fixture" type="file" accept="image/jpeg,image/png"><button data-sample="0">Public sample A</button><button data-sample="1">Public sample B</button><button data-sample="2">Public sample C</button><button data-sample="3">Public sample D</button>
<pre id="report">Choose a sample.</pre><div id="results"></div><iframe id="app-frame" src="/" title="Actual StyleMe root interface"></iframe><script type="module" src="./faceBrowser.js"></script></html>
